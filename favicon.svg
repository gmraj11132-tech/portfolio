<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Mac Glass Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.6"/>

  <!-- Code brackets </> and Java Steam accent -->
  <!-- Left Bracket < -->
  <path d="M 21 23 L 11 32 L 21 41" fill="none" stroke="url(#codeGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Right Bracket > -->
  <path d="M 43 23 L 53 32 L 43 41" fill="none" stroke="url(#codeGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Slash / Center with Java Cup Core -->
  <path d="M 35 20 L 29 44" fill="none" stroke="url(#cupGrad)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Subtle Top Steam lines -->
  <path d="M 27 15 Q 29 11 27 8" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M 33 16 Q 35 12 33 9" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M 39 15 Q 41 11 39 8" fill="none" stroke="#c084fc" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
</svg>
